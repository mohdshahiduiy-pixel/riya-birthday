<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Riya 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background Effects -->
  <canvas id="fireworks"></canvas>
  <div id="floatingHearts"></div>

  <!-- Audio (DO NOT AUTOPLAY) -->
  <audio id="birthdaySong" src="song.mp3" preload="auto"></audio>

  <!-- Card -->
  <div class="card">
    <h1>🎉 Happy Birthday 🎉</h1>
    <div class="name">❤️ Riya ✨</div>

    <div class="content">
      <div id="letterBox" class="letter"></div>

      <div class="photo-wrapper">
        <img src="riya.jpg" class="photo-card" alt="Riya">
        <div class="photo-heart">❤️</div>
      </div>
    </div>

    <div class="buttons">
      <button id="surpriseBtn">🎁 Surprise</button>
      <button id="confessBtn">💌 Confess</button>
      <button id="musicBtn">🎵 Play Song</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
