<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Riya 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Fireworks -->
  <canvas id="fireworks"></canvas>

  <!-- Floating Hearts -->
  <div id="floatingHearts"></div>

  <!-- Birthday Card -->
  <div class="card">
    <h1>🎉 Happy Birthday 🎉</h1>
    <div class="name">❤️ Riya ✨</div>

    <div class="content">
      <!-- LETTER -->
      <div class="letter" id="letterBox"></div>

      <!-- PHOTO -->
      <div class="photo-wrapper">
        <img src="riya.jpg" alt="Riya" class="photo-card">
        <div class="photo-heart">❤️</div>
      </div>
    </div>

    <!-- BUTTONS -->
    <div class="buttons">
      <button id="surpriseBtn">Surprise</button>
      <button id="confessBtn">Confess</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
